<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Border -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#222222" stroke-width="1.5" />

  <!-- Central Graphic: Open Book / Notebook icon -->
  <g transform="translate(600, 260)">
    <!-- Book pages -->
    <path d="M-60,-30 C-30,-45 -10,-45 0,-35 C10,-45 30,-45 60,-30 L60,35 C30,20 10,20 0,30 C-10,20 -30,20 -60,35 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <line x1="0" y1="-35" x2="0" y2="30" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Text -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="1">
    Burası Neresi?
  </text>
  <text x="600" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#888888" letter-spacing="0.5">
    Yusuf Bozan — Kişisel Not Defteri
  </text>
</svg>
