media:
  - name: gorseller
    label: Görseller & Medya
    input: public/gorseller
    output: /gorseller

content:
  # 1. Uzun Makaleler & Notlar
  - name: yazilar
    label: Yazılar
    type: collection
    path: yazilar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
        - summary
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        description: "Yazının ana başlığı (URL bağlantısı bu başlıktan türetilir)."
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Yazının yayınlanma tarihi ve saati."
        options:
          time: true
        required: true

      - name: summary
        label: Kısa Özet
        type: text
        description: "Yazı listesinde ve arama motoru önizlemelerinde görünecek kısa özet."

      - name: body
        label: İçerik
        type: rich-text
        description: "Yazının Markdown veya zengin metin içeriği."
        options:
          media: gorseller
        required: true

      - name: image
        label: Kapak Görseli
        type: image
        description: "Yazının başında ve sosyal medya önizlemelerinde görünecek görsel (isteğe bağlı)."
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası
        type: file
        description: "Yazı için kaydedilmiş seslendirme veya ses kaydı dosyası (isteğe bağlı)."
        options:
          media: gorseller

  # 2. Akış (Mikro-Blog / Anlık Düşünceler)
  - name: akis
    label: Akış (Anlık Düşünceler)
    type: collection
    path: akis
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields:
        - body
        - date
      primary: body
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: body
        label: Düşünce Metni
        type: rich-text
        description: "Akışta paylaşılacak kısa düşünce, anlık not veya alıntı."
        options:
          media: gorseller
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Düşüncenin paylaşıldığı tarih ve saat."
        options:
          time: true
        required: true

      - name: image
        label: Görsel
        type: image
        description: "Düşünceye eklenecek fotoğraf veya ekran görüntüsü (isteğe bağlı)."
        options:
          media: gorseller

      - name: audio
        label: Ses Notu
        type: file
        description: "Düşünceye eklenecek kısa ses kaydı (isteğe bağlı)."
        options:
          media: gorseller

      - name: mediaDetails
        label: Dizi / Film Notu
        type: object
        description: "Eğer bir dizi veya film izlerken not alıyorsanız ilgili detaylar (isteğe bağlı)."
        fields:
          - name: season
            label: Sezon No
            type: string
            description: "İzlenen sezon numarası (örn. 2)."
          - name: episode
            label: Bölüm No
            type: string
            description: "İzlenen bölüm numarası (örn. 15)."
          - name: rating
            label: Puan
            type: string
            description: "Eser için kişisel puanınız (örn. 7.5 veya 9)."

  # 3. Şu Sıralar (Now Bento Şeridi)
  - name: now
    label: Şu Sıralar
    type: file
    path: src/content/now.json
    fields:
      - name: focus
        label: Güncel Odak
        type: object
        description: "Şu an üzerinde çalıştığınız proje, hedef veya meşguliyet."
        fields:
          - name: title
            label: Ne ile Uğraşıyorsunuz?
            type: string
            description: "Çalıştığınız hedefin veya projenin adı (örn. YKS)."
            required: true
          - name: status
            label: Çalışma Durumu
            type: select
            description: "Gelişme ve ilerleme durumu."
            options:
              values:
                - Çalışıyorum
                - Aktif Geliştirme
                - Odaklanıyorum
                - Planlanıyor
                - Tamamlandı
          - name: description
            label: Kısa Açıklama
            type: text
            description: "Hedef veya çalışma hakkında bir iki cümlelik not."
          - name: updatedAt
            label: Zaman Notu
            type: string
            description: "Örn. Bugün, Bu hafta."

      - name: shelf
        label: Şu An Rafta
        type: object
        description: "Takip ettiğiniz veya okuduğunuz eserler."
        fields:
          - name: itemTitle
            label: Ne İzliyor / Okuyorsunuz?
            type: string
            description: "Örn. THE MENTALIST."
            required: true
          - name: itemType
            label: Türü
            type: select
            description: "Dizi, film veya kitap."
            options:
              values:
                - Dizi
                - Film
                - Kitap
            required: true
          - name: status
            label: Takip Durumu
            type: select
            description: "İzleme veya okuma durumu."
            options:
              values:
                - Devam Ediyorum
                - İzleniyor
                - Okunuyor
                - Tamamlandı
                - Başyapıt
                - Takip Ediliyor
          - name: itemMeta
            label: Neresindesiniz?
            type: string
            description: "Sezon, bölüm veya sayfa bilgisi (örn. S02 • B04 veya s. 120)."
          - name: secondaryTitle
            label: İkinci Bir Eser (Varsa)
            type: string
            description: "Aynı anda okuduğunuz bir kitap veya izlediğiniz başka bir yapım."
          - name: secondaryType
            label: İkinci Eserin Türü
            type: select
            description: "Kitap, dizi veya film."
            options:
              values:
                - Kitap
                - Dizi
                - Film
          - name: secondaryStatus
            label: İkinci Eserin Durumu
            type: select
            description: "Okuma veya izleme durumu."
            options:
              values:
                - Okunuyor
                - İzleniyor
                - Devam Ediyorum
                - Tamamlandı
                - Başyapıt
                - Takip Ediliyor
          - name: secondaryMeta
            label: İkinci Eser İlerlemesi
            type: string
            description: "Örn. s. 45 / 320."

      - name: thought
        label: Günün Düşüncesi
        type: object
        description: "Aklınızda yer eden bir alıntı veya kısa not."
        fields:
          - name: quote
            label: Düşünce veya Alıntı
            type: text
            description: "Paylaşmak istediğiniz cümle veya aforizma."
            required: true
          - name: context
            label: Kime Ait / Kaynak
            type: string
            description: "Alıntının sahibi veya bağlamı (örn. Marcus Aurelius)."
          - name: label
            label: Kutu Rozeti
            type: string
            description: "Kart üzerindeki ufak etiket (örn. Alıntı, Mikro-Not)."
          - name: thoughtDate
            label: Tarih / Not Zamanı
            type: string
            description: "Örn. 16 Kasım veya Bugün."

  # 4. Rafım (Film, Dizi & Kitap Arşivi)
  - name: raf
    label: Rafım (Kültür Arşivi)
    type: collection
    path: raf
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - type
        - status
        - rating
      primary: title
      sort:
        - title
        - type
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Eser Başlığı
        type: string
        description: "Eserin tam adı (Film, dizi veya kitap başlığı)."
        required: true

      - name: type
        label: Tür
        type: select
        description: "Eserin temel kategorisi."
        options:
          values:
            - Film
            - Dizi
            - Kitap
        required: true

      - name: status
        label: Durum
        type: select
        description: "Eserin güncel izleme veya okuma durumu."
        options:
          values:
            - Tamamlandı
            - İzleniyor
            - Okunuyor
            - Başyapıt
        required: true

      - name: rating
        label: Puan
        type: string
        description: "Kişisel değerlendirme puanınız (örn. 8.0 veya ★ 9.4)."

      - name: category
        label: Kategori / Janrlar
        type: select
        description: "Eserin tür ve janr etiketleri (birden fazla seçilebilir)."
        options:
          multiple: true
          values:
            - Bilim Kurgu
            - Dram
            - Gerilim
            - Korku
            - Romantik
            - Suç
            - Felsefe
            - Tarih
            - Klasik
            - Biyografi
            - Belgesel
            - Animasyon
            - Fantastik
            - Komedi
            - Macera
            - Psikoloji

      - name: body
        label: Kişisel Not & İnceleme
        type: rich-text
        description: "Eser hakkında kişisel görüşleriniz, inceleme ve analiz notlarınız."
        options:
          media: gorseller

      - name: poster
        label: Afiş Görseli
        type: image
        description: "Eserin dikey afişi veya kapak görseli (isteğe bağlı)."
        options:
          media: gorseller

      - name: year
        label: Çıkış Yılı
        type: string
        description: "Eserin yayınlandığı veya vizyona girdiği yıl (örn. 2026)."

      - name: details
        label: Bölüm / Sayfa Detayı
        type: object
        description: "Dizi veya kitaplar için bölüm, sezon veya sayfa ilerleme detayları (isteğe bağlı)."
        fields:
          - name: badge
            label: Rozet / Sezon-Bölüm
            type: string
            description: "Kart üzerinde görünecek kısa rozet (örn. S02 • B04 veya Cilt 1)."
          - name: progress
            label: İlerleme Durumu
            type: string
            description: "İlerleme oranı veya sayfa sayısı (örn. s. 84 / 176)."

      - name: updatedAt
        label: Son Durum Zamanı
        type: string
        description: "Raftaki durumun güncellenme zamanı (örn. Dün, Bugün veya tarih)."

  # 5. Videolar
  - name: videolar
    label: Videolar
    type: collection
    path: videolar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Video Başlığı
        type: string
        description: "Videonun başlığı veya konusu."
        required: true

      - name: youtubeId
        label: YouTube Linki veya ID'si
        type: string
        description: "YouTube video bağlantısı veya 11 karakterlik video kimliği (örn. dQw4w9WgXcQ)."
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Videonun eklendiği veya yayınlandığı tarih ve saat."
        options:
          time: true
        required: true

      - name: body
        label: Açıklama
        type: rich-text
        description: "Video hakkında kişisel notlar veya açıklama metni (isteğe bağlı)."
        options:
          media: gorseller

  # 6. Profil, Hakkımda ve Sosyal Medya Ayarları
  - name: profil
    label: Profil & Hakkımda
    type: file
    path: src/content/profil.json
    fields:
      - name: title
        label: Sayfa Başlığı
        type: string
        description: "Hakkımda sayfasının başlığı (örn. Merhaba veya Hakkımda)."

      - name: bio
        label: Kendinizi Tanıtın
        type: rich-text
        description: "Hakkımda sayfasında yer alan ana biyografi metniniz."
        options:
          media: gorseller

      - name: avatar
        label: Profil Fotoğrafı
        type: image
        description: "Portre veya profil fotoğrafınız (isteğe bağlı)."
        options:
          media: gorseller

      - name: location
        label: Şehir / Konum
        type: string
        description: "Yaşadığınız şehir veya bölge (örn. İstanbul, Türkiye)."

      - name: social
        label: Sosyal Medya Hesapları
        type: object
        description: "Sitede bağlantı vermek istediğiniz sosyal platformlar."
        fields:
          - name: twitter
            label: X (Twitter)
            type: object
            description: "X profil ayarları."
            fields:
              - name: active
                label: Göster
                type: boolean
                description: "Profil bağlantısını sitede göster."
              - name: url
                label: Profil Adresi
                type: string
                description: "Örn. https://x.com/kullanici."

          - name: instagram
            label: Instagram
            type: object
            description: "Instagram profil ayarları."
            fields:
              - name: active
                label: Göster
                type: boolean
                description: "Profil bağlantısını sitede göster."
              - name: url
                label: Profil Adresi
                type: string
                description: "Örn. https://instagram.com/kullanici."

          - name: youtube
            label: YouTube
            type: object
            description: "YouTube kanal ayarları."
            fields:
              - name: active
                label: Göster
                type: boolean
                description: "Kanal bağlantısını sitede göster."
              - name: url
                label: Profil Adresi
                type: string
                description: "Örn. https://youtube.com/@kanal."

          - name: facebook
            label: Facebook
            type: object
            description: "Facebook profil ayarları."
            fields:
              - name: active
                label: Göster
                type: boolean
                description: "Profil bağlantısını sitede göster."
              - name: url
                label: Profil Adresi
                type: string
                description: "Örn. https://facebook.com/kullanici."

          - name: github
            label: GitHub
            type: object
            description: "GitHub profil ayarları."
            fields:
              - name: active
                label: Göster
                type: boolean
                description: "Profil bağlantısını sitede göster."
              - name: url
                label: Profil Adresi
                type: string
                description: "Örn. https://github.com/kullanici."

          - name: linkedin
            label: LinkedIn
            type: object
            description: "LinkedIn profil ayarları."
            fields:
              - name: active
                label: Göster
                type: boolean
                description: "Profil bağlantısını sitede göster."
              - name: url
                label: Profil Adresi
                type: string
                description: "Örn. https://linkedin.com/in/kullanici."

      - name: customLinks
        label: Diğer Bağlantılar
        type: object
        list: true
        description: "Spotify, Substack gibi diğer platform bağlantılarınız."
        fields:
          - name: title
            label: Platform Adı
            type: string
            description: "Örn. Spotify."

          - name: url
            label: Web Adresi
            type: string
            description: "Örn. https://open.spotify.com/user/..."

          - name: active
            label: Göster
            type: boolean
            description: "Bağlantıyı sitede göster."
