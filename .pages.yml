media:
  - name: gorseller
    label: Görseller
    input: public/gorseller
    output: /gorseller

  - name: sesler
    label: Sesler
    input: public/sesler
    output: /sesler

content:
  # 1. Uzun Makaleler & Notlar
  - name: yazilar
    label: Yazılar
    type: collection
    path: yazilar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        required: true

      - name: date
        label: Tarih
        type: date
        required: true

      - name: summary
        label: Özet
        type: text

      - name: tags
        label: Etiketler
        type: string
        list: true

      - name: image
        label: Kapak Görseli
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası
        type: file
        options:
          media: sesler

      - name: body
        label: İçerik
        type: rich-text
        options:
          media: gorseller

  # 2. Akış (Mikro-Blog / Anlık Düşünceler)
  - name: akis
    label: Akış (Anlık Düşünceler)
    type: collection
    path: akis
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      primary: date
      sort: date
      order: desc
    fields:
      - name: date
        label: Tarih ve Saat
        type: date
        options:
          time: true
        required: true

      - name: image
        label: Görsel
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası
        type: file
        options:
          media: sesler

      - name: body
        label: Düşünce Metni
        type: rich-text
        options:
          media: gorseller
        required: true

  # 3. Profil, Hakkımda ve Sosyal Medya Ayarları
  - name: profil
    label: Hakkımda & Sosyal Medya
    type: file
    path: src/content/profil.json
    fields:
      - name: title
        label: Hakkımda Başlığı
        type: string

      - name: bio
        label: Biyografi Metni
        type: rich-text
        options:
          media: gorseller

      - name: socialLinks
        label: Sosyal Medya Hesapları
        type: object
        list: true
        collapsible: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - value: x
                  label: X (Twitter)
                - value: instagram
                  label: Instagram
                - value: youtube
                  label: YouTube
                - value: facebook
                  label: Facebook
                - value: github
                  label: GitHub
                - value: linkedin
                  label: LinkedIn
                - value: custom
                  label: Özel Bağlantı / Web Sitesi
          - name: name
            label: Görünen İsim (İsteğe bağlı)
            type: string
          - name: url
            label: Profil Bağlantısı (URL)
            type: string
            required: true
          - name: enabled
            label: Aktif
            type: boolean
            default: true
