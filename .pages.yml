media:
  - name: gorseller
    label: Görseller & Medya
    input: public/gorseller
    output: /gorseller

content:
  # 1. Uzun Makaleler & Notlar
  - name: yazilar
    label: Yazılar
    type: collection
    path: yazilar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
        - summary
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        description: "Yazının ana başlığı (URL bağlantısı bu başlıktan türetilir)."
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Yazının yayınlanma tarihi ve saati."
        options:
          time: true
        required: true

      - name: summary
        label: Kısa Özet
        type: text
        description: "Yazı listesinde ve arama motoru önizlemelerinde görünecek kısa özet."

      - name: body
        label: İçerik
        type: rich-text
        description: "Yazının Markdown veya zengin metin içeriği."
        options:
          media: gorseller
        required: true

      - name: image
        label: Kapak Görseli
        type: image
        description: "Yazının başında ve sosyal medya önizlemelerinde görünecek görsel (isteğe bağlı)."
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası
        type: file
        description: "Yazı için kaydedilmiş seslendirme veya ses kaydı dosyası (isteğe bağlı)."
        options:
          media: gorseller

  # 2. Akış (Mikro-Blog / Anlık Düşünceler)
  - name: akis
    label: Akış (Anlık Düşünceler)
    type: collection
    path: akis
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields:
        - body
        - date
      primary: body
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: body
        label: Düşünce Metni
        type: rich-text
        description: "Akışta paylaşılacak kısa düşünce, anlık not veya alıntı."
        options:
          media: gorseller
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Düşüncenin paylaşıldığı tarih ve saat."
        options:
          time: true
        required: true

      - name: image
        label: Görsel
        type: image
        description: "Düşünceye eklenecek fotoğraf veya ekran görüntüsü (isteğe bağlı)."
        options:
          media: gorseller

      - name: audio
        label: Ses Notu
        type: file
        description: "Düşünceye eklenecek kısa ses kaydı (isteğe bağlı)."
        options:
          media: gorseller

      - name: mediaDetails
        label: Dizi / Film Notu
        type: object
        description: "Eğer bir dizi veya film izlerken not alıyorsanız ilgili detaylar (isteğe bağlı)."
        fields:
          - name: season
            label: Sezon No
            type: string
            description: "İzlenen sezon numarası (örn. 2)."
          - name: episode
            label: Bölüm No
            type: string
            description: "İzlenen bölüm numarası (örn. 15)."
          - name: rating
            label: Puan
            type: string
            description: "Eser için kişisel puanınız (örn. 7.5 veya 9)."

  # 3. Şu Sıralar (Now Bento Şeridi)
  - name: now
    label: Şu Sıralar (Now Bento)
    type: file
    path: src/content/now.json
    fields:
      - name: focus
        label: 1. Üzerinde Çalıştığım (Odak)
        type: object
        fields:
          - name: title
            label: Proje / Odak Başlığı
            type: string
          - name: description
            label: Açıklama
            type: text
          - name: status
            label: Durum (örn. Aktif Geliştirme)
            type: string
          - name: updatedAt
            label: Güncelleme (örn. Bugün)
            type: string
      - name: shelf
        label: 2. Şu An Rafta (Dizi / Film / Kitap)
        type: object
        fields:
          - name: itemTitle
            label: Birincil Eser (Dizi / Film / Kitap)
            type: string
          - name: itemType
            label: Tür (örn. Dizi, Kitap, Film)
            type: string
          - name: itemMeta
            label: Bölüm / Sayfa / Süre (örn. S02 • B04)
            type: string
          - name: status
            label: Durum (örn. Takip Ediliyor)
            type: string
          - name: secondaryTitle
            label: İkincil Eser (İsteğe bağlı)
            type: string
          - name: secondaryType
            label: İkincil Tür (örn. Kitap, Dizi, Film)
            type: string
          - name: secondaryMeta
            label: İkincil Bölüm / Sayfa
            type: string
          - name: secondaryStatus
            label: İkincil Durum (örn. Okunuyor, İzleniyor)
            type: string
      - name: thought
        label: 3. Son Düşünce (Aforizma / Alıntı)
        type: object
        fields:
          - name: quote
            label: Düşünce / Alıntı Metni
            type: text
          - name: context
            label: Konu / Bağlam
            type: string
          - name: label
            label: Etiket (örn. Mikro-Not Defteri)
            type: string
          - name: thoughtDate
            label: Tarih / Zaman (örn. 16 Kasım)
            type: string

  # 4. Rafım (Film, Dizi & Kitap Arşivi)
  - name: raf
    label: Rafım (Kültür Arşivi)
    type: collection
    path: raf
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - type
        - status
        - rating
      primary: title
      sort:
        - title
        - type
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Eser Başlığı
        type: string
        description: "Eserin tam adı (Film, dizi veya kitap başlığı)."
        required: true

      - name: type
        label: Tür
        type: select
        description: "Eserin temel kategorisi."
        options:
          values:
            - Film
            - Dizi
            - Kitap
        required: true

      - name: status
        label: Durum
        type: select
        description: "Eserin güncel izleme veya okuma durumu."
        options:
          values:
            - Tamamlandı
            - İzleniyor
            - Okunuyor
            - Başyapıt
        required: true

      - name: rating
        label: Puan
        type: string
        description: "Kişisel değerlendirme puanınız (örn. 8.0 veya ★ 9.4)."

      - name: category
        label: Kategori / Janrlar
        type: select
        list: true
        description: "Eserin tür ve janr etiketleri (birden fazla seçilebilir)."
        options:
          multiple: true
          values:
            - Bilim Kurgu
            - Dram
            - Gerilim
            - Korku
            - Romantik
            - Suç
            - Felsefe
            - Tarih
            - Klasik
            - Biyografi
            - Belgesel
            - Animasyon
            - Fantastik
            - Komedi
            - Macera
            - Psikoloji

      - name: body
        label: Kişisel Not & İnceleme
        type: rich-text
        description: "Eser hakkında kişisel görüşleriniz, inceleme ve analiz notlarınız."
        options:
          media: gorseller

      - name: poster
        label: Afiş Görseli
        type: image
        description: "Eserin dikey afişi veya kapak görseli (isteğe bağlı)."
        options:
          media: gorseller

      - name: year
        label: Çıkış Yılı
        type: string
        description: "Eserin yayınlandığı veya vizyona girdiği yıl (örn. 2026)."

      - name: details
        label: Bölüm / Sayfa Detayı
        type: object
        description: "Dizi veya kitaplar için bölüm, sezon veya sayfa ilerleme detayları (isteğe bağlı)."
        fields:
          - name: badge
            label: Rozet / Sezon-Bölüm
            type: string
            description: "Kart üzerinde görünecek kısa rozet (örn. S02 • B04 veya Cilt 1)."
          - name: progress
            label: İlerleme Durumu
            type: string
            description: "İlerleme oranı veya sayfa sayısı (örn. s. 84 / 176)."

      - name: updatedAt
        label: Son Durum Zamanı
        type: string
        description: "Raftaki durumun güncellenme zamanı (örn. Dün, Bugün veya tarih)."

  # 5. Videolar
  - name: videolar
    label: Videolar
    type: collection
    path: videolar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
      primary: title
    fields:
      - name: title
        label: Video Başlığı
        type: string
        required: true
      - name: youtubeId
        label: YouTube Linki veya ID'si
        type: string
        required: true
      - name: date
        label: Tarih ve Saat
        type: date
        options:
          time: true
      - name: body
        label: Açıklama (İsteğe bağlı)
        type: rich-text
        options:
          media: gorseller

  # 6. Profil, Hakkımda ve Sosyal Medya Ayarları
  - name: profil
    label: Hakkımda & Sosyal Medya
    type: file
    path: src/content/profil.json
    fields:
      - name: title
        label: Hakkımda Başlığı
        type: string

      - name: location
        label: Şehir / Konum (İsteğe bağlı)
        type: string

      - name: avatar
        label: Profil Fotoğrafı (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: bio
        label: Biyografi Metni
        type: rich-text
        options:
          media: gorseller

      - name: social
        label: Sosyal Medya Bağlantıları (Tıkla Aç)
        type: object
        fields:
          - name: twitter
            label: X (Twitter)
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: instagram
            label: Instagram
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: youtube
            label: YouTube
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: facebook
            label: Facebook
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: github
            label: GitHub
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: linkedin
            label: LinkedIn
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

      - name: customLinks
        label: Özel Bağlantılar (Spotify, Substack vb.)
        type: object
        list: true
        fields:
          - name: title
            label: Platform Adı
            type: string

          - name: url
            label: Bağlantı Adresi
            type: string

          - name: active
            label: Aktif Et
            type: boolean
