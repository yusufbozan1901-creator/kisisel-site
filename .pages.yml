media:
  - name: gorseller
    label: Görseller & Medya
    input: public/gorseller
    output: /gorseller

content:
  # 1. Uzun Makaleler & Notlar
  - name: yazilar
    label: Yazılar
    type: collection
    path: yazilar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
        - summary
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        required: true

      - name: date
        label: Tarih
        type: date
        required: true

      - name: summary
        label: Kısa Özet
        type: text

      - name: tags
        label: Etiketler
        type: string
        list: true

      - name: image
        label: Kapak Görseli (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası (İsteğe bağlı)
        type: file
        options:
          media: gorseller

      - name: body
        label: İçerik
        type: rich-text
        options:
          media: gorseller
        required: true

  # 2. Akış (Mikro-Blog / Anlık Düşünceler)
  - name: akis
    label: Akış (Anlık Düşünceler)
    type: collection
    path: akis
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields:
        - body
        - date
      primary: body
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: body
        label: Düşünce Metni
        type: rich-text
        options:
          media: gorseller
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        options:
          time: true
        required: true

      - name: image
        label: Görsel (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Notu (İsteğe bağlı)
        type: file
        options:
          media: gorseller

  # 3. Profil, Hakkımda ve Sosyal Medya Ayarları
  - name: profil
    label: Hakkımda & Sosyal Medya
    type: file
    path: src/content/profil.json
    fields:
      - name: title
        label: Hakkımda Başlığı
        type: string

      - name: bio
        label: Biyografi Metni
        type: rich-text
        options:
          media: gorseller

      - name: social
        label: Sosyal Medya Bağlantıları
        type: object
        collapsed: true
        options:
          collapsed: true
          collapsible: true
        fields:
          - name: twitter
            label: X (Twitter) URL
            type: string

          - name: instagram
            label: Instagram URL
            type: string

          - name: youtube
            label: YouTube URL
            type: string

          - name: facebook
            label: Facebook URL
            type: string

          - name: linkedin
            label: LinkedIn URL
            type: string

          - name: telegram
            label: Telegram URL
            type: string
