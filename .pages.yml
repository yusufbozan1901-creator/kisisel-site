media:
  - name: gorseller
    label: Görseller & Medya
    input: public/gorseller
    output: /gorseller

content:
  # 1. Uzun Makaleler & Notlar
  - name: yazilar
    label: Yazılar
    type: collection
    path: yazilar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
        - summary
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        description: "Yazının ana başlığı (URL bağlantısı bu başlıktan türetilir)."
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Yazının yayınlanma tarihi ve saati."
        options:
          time: true
        required: true

      - name: summary
        label: Kısa Özet
        type: text
        description: "Yazı listesinde ve arama motoru önizlemelerinde görünecek kısa özet."

      - name: body
        label: İçerik
        type: rich-text
        description: "Yazının Markdown veya zengin metin içeriği."
        options:
          media: gorseller
        required: true

      - name: image
        label: Kapak Görseli
        type: image
        description: "Yazının başında ve sosyal medya önizlemelerinde görünecek görsel (isteğe bağlı)."
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası
        type: file
        description: "Yazı için kaydedilmiş seslendirme veya ses kaydı dosyası (isteğe bağlı)."
        options:
          media: gorseller

  # 2. Akış (Mikro-Blog / Anlık Düşünceler)
  - name: akis
    label: Akış (Anlık Düşünceler)
    type: collection
    path: akis
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields:
        - body
        - date
      primary: body
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: body
        label: Düşünce Metni
        type: rich-text
        description: "Akışta paylaşılacak kısa düşünce, anlık not veya alıntı."
        options:
          media: gorseller
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Düşüncenin paylaşıldığı tarih ve saat."
        options:
          time: true
        required: true

      - name: image
        label: Görsel
        type: image
        description: "Düşünceye eklenecek fotoğraf veya ekran görüntüsü (isteğe bağlı)."
        options:
          media: gorseller

      - name: audio
        label: Ses Notu
        type: file
        description: "Düşünceye eklenecek kısa ses kaydı (isteğe bağlı)."
        options:
          media: gorseller

      - name: mediaDetails
        label: Dizi / Film Notu
        type: object
        description: "Eğer bir dizi veya film izlerken not alıyorsanız ilgili detaylar (isteğe bağlı)."
        fields:
          - name: season
            label: Sezon No
            type: string
            description: "İzlenen sezon numarası (örn. 2)."
          - name: episode
            label: Bölüm No
            type: string
            description: "İzlenen bölüm numarası (örn. 15)."
          - name: rating
            label: Puan
            type: string
            description: "Eser için kişisel puanınız (örn. 7.5 veya 9)."

  # 3. Şu Sıralar (Now Bento Şeridi)
  - name: now
    label: Şu Sıralar (Now Bento)
    type: file
    path: src/content/now.json
    fields:
      - name: focus
        label: 1. Üzerinde Çalıştığım (Odak)
        type: object
        description: "Ana sayfada 'Şu Sıralar' kutusunda görünen güncel odak ve proje alanı."
        fields:
          - name: title
            label: Proje / Odak Başlığı
            type: string
            description: "Üzerinde çalışılan hedefin, konunun veya projenin adı (örn. YKS)."
            required: true
          - name: status
            label: Durum
            type: select
            description: "Çalışmanın mevcut durumu."
            options:
              values:
                - Çalışıyorum
                - Aktif Geliştirme
                - Odaklanıyorum
                - Planlanıyor
                - Tamamlandı
          - name: description
            label: Açıklama
            type: text
            description: "Hedef veya çalışma hakkında kısa açıklama."
          - name: updatedAt
            label: Güncelleme Zamanı
            type: string
            description: "Son durum veya güncelleme notu (örn. Bugün veya Bu hafta)."

      - name: shelf
        label: 2. Şu An Rafta (Dizi / Film / Kitap)
        type: object
        description: "Ana sayfada şu an izlediğiniz veya okuduğunuz birincil ve ikincil eserler."
        fields:
          - name: itemTitle
            label: Birincil Eser Adı
            type: string
            description: "Şu an takip edilen birincil eserin adı (örn. THE MENTALIST)."
            required: true
          - name: itemType
            label: Birincil Tür
            type: select
            description: "Birincil eserin türü."
            options:
              values:
                - Dizi
                - Film
                - Kitap
            required: true
          - name: status
            label: Birincil Durum
            type: select
            description: "Birincil eserin izleme veya okuma durumu."
            options:
              values:
                - Devam Ediyorum
                - İzleniyor
                - Okunuyor
                - Tamamlandı
                - Başyapıt
                - Takip Ediliyor
          - name: itemMeta
            label: Bölüm / Sayfa / Süre
            type: string
            description: "Sezon, bölüm veya sayfa bilgisi (örn. S02 • B04 veya s. 120)."
          - name: secondaryTitle
            label: İkincil Eser Adı
            type: string
            description: "Takip edilen ikincil eser adı (isteğe bağlı, örn. SUÇ VE CEZA)."
          - name: secondaryType
            label: İkincil Tür
            type: select
            description: "İkincil eserin türü (isteğe bağlı)."
            options:
              values:
                - Kitap
                - Dizi
                - Film
          - name: secondaryStatus
            label: İkincil Durum
            type: select
            description: "İkincil eserin izleme veya okuma durumu (isteğe bağlı)."
            options:
              values:
                - Okunuyor
                - İzleniyor
                - Devam Ediyorum
                - Tamamlandı
                - Başyapıt
                - Takip Ediliyor
          - name: secondaryMeta
            label: İkincil Bölüm / Sayfa
            type: string
            description: "İkincil eser için detay bilgisi (örn. s. 45 / 320)."

      - name: thought
        label: 3. Son Düşünce (Aforizma / Alıntı)
        type: object
        description: "Ana sayfadaki bento kutusunda yer alan kısa alıntı veya aforizma."
        fields:
          - name: quote
            label: Düşünce / Alıntı Metni
            type: text
            description: "Günün veya haftanın akılda kalan aforizması veya düşüncesi."
            required: true
          - name: context
            label: Konu / Bağlam
            type: string
            description: "Düşüncenin kaynağı veya bağlamı (örn. Marcus Aurelius veya Yolda yürürken)."
          - name: label
            label: Etiket
            type: string
            description: "Kutucuk üstündeki rozet başlığı (örn. Alıntı veya Mikro-Not Defteri)."
          - name: thoughtDate
            label: Tarih / Zaman
            type: string
            description: "Düşüncenin zaman ibaresi (örn. 16 Kasım veya Bugün)."

  # 4. Rafım (Film, Dizi & Kitap Arşivi)
  - name: raf
    label: Rafım (Kültür Arşivi)
    type: collection
    path: raf
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - type
        - status
        - rating
      primary: title
      sort:
        - title
        - type
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Eser Başlığı
        type: string
        description: "Eserin tam adı (Film, dizi veya kitap başlığı)."
        required: true

      - name: type
        label: Tür
        type: select
        description: "Eserin temel kategorisi."
        options:
          values:
            - Film
            - Dizi
            - Kitap
        required: true

      - name: status
        label: Durum
        type: select
        description: "Eserin güncel izleme veya okuma durumu."
        options:
          values:
            - Tamamlandı
            - İzleniyor
            - Okunuyor
            - Başyapıt
        required: true

      - name: rating
        label: Puan
        type: string
        description: "Kişisel değerlendirme puanınız (örn. 8.0 veya ★ 9.4)."

      - name: category
        label: Kategori / Janrlar
        type: select
        list: true
        description: "Eserin tür ve janr etiketleri (birden fazla seçilebilir)."
        options:
          multiple: true
          values:
            - Bilim Kurgu
            - Dram
            - Gerilim
            - Korku
            - Romantik
            - Suç
            - Felsefe
            - Tarih
            - Klasik
            - Biyografi
            - Belgesel
            - Animasyon
            - Fantastik
            - Komedi
            - Macera
            - Psikoloji

      - name: body
        label: Kişisel Not & İnceleme
        type: rich-text
        description: "Eser hakkında kişisel görüşleriniz, inceleme ve analiz notlarınız."
        options:
          media: gorseller

      - name: poster
        label: Afiş Görseli
        type: image
        description: "Eserin dikey afişi veya kapak görseli (isteğe bağlı)."
        options:
          media: gorseller

      - name: year
        label: Çıkış Yılı
        type: string
        description: "Eserin yayınlandığı veya vizyona girdiği yıl (örn. 2026)."

      - name: details
        label: Bölüm / Sayfa Detayı
        type: object
        description: "Dizi veya kitaplar için bölüm, sezon veya sayfa ilerleme detayları (isteğe bağlı)."
        fields:
          - name: badge
            label: Rozet / Sezon-Bölüm
            type: string
            description: "Kart üzerinde görünecek kısa rozet (örn. S02 • B04 veya Cilt 1)."
          - name: progress
            label: İlerleme Durumu
            type: string
            description: "İlerleme oranı veya sayfa sayısı (örn. s. 84 / 176)."

      - name: updatedAt
        label: Son Durum Zamanı
        type: string
        description: "Raftaki durumun güncellenme zamanı (örn. Dün, Bugün veya tarih)."

  # 5. Videolar
  - name: videolar
    label: Videolar
    type: collection
    path: videolar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Video Başlığı
        type: string
        description: "Videonun başlığı veya konusu."
        required: true

      - name: youtubeId
        label: YouTube Linki veya ID'si
        type: string
        description: "YouTube video bağlantısı veya 11 karakterlik video kimliği (örn. dQw4w9WgXcQ)."
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        description: "Videonun eklendiği veya yayınlandığı tarih ve saat."
        options:
          time: true
        required: true

      - name: body
        label: Açıklama
        type: rich-text
        description: "Video hakkında kişisel notlar veya açıklama metni (isteğe bağlı)."
        options:
          media: gorseller

  # 6. Profil, Hakkımda ve Sosyal Medya Ayarları
  - name: profil
    label: Hakkımda & Sosyal Medya
    type: file
    path: src/content/profil.json
    fields:
      - name: title
        label: Hakkımda Başlığı
        type: string
        description: "Hakkımda sayfasının üst başlığı (örn. Hakkımda veya Merhaba)."

      - name: bio
        label: Biyografi Metni
        type: rich-text
        description: "Hakkımda sayfasında yer alan ana tanıtım ve biyografi metni."
        options:
          media: gorseller

      - name: avatar
        label: Profil Fotoğrafı
        type: image
        description: "Profil veya portre fotoğrafınız (isteğe bağlı)."
        options:
          media: gorseller

      - name: location
        label: Şehir / Konum
        type: string
        description: "Yaşadığınız şehir veya bölge bilgisi (isteğe bağlı, örn. İstanbul, Türkiye)."

      - name: social
        label: Sosyal Medya Bağlantıları
        type: object
        description: "Sosyal medya platform bağlantıları ve aktiflik durumları."
        fields:
          - name: twitter
            label: X (Twitter)
            type: object
            description: "X (Twitter) profil bağlantısı ayarları."
            fields:
              - name: active
                label: Aktif Et
                type: boolean
                description: "Bu bağlantıyı sitede göster."
              - name: url
                label: Profil Bağlantısı
                type: string
                description: "Tam profil web adresi (örn. https://x.com/kullanici)."

          - name: instagram
            label: Instagram
            type: object
            description: "Instagram profil bağlantısı ayarları."
            fields:
              - name: active
                label: Aktif Et
                type: boolean
                description: "Bu bağlantıyı sitede göster."
              - name: url
                label: Profil Bağlantısı
                type: string
                description: "Tam profil web adresi (örn. https://instagram.com/kullanici)."

          - name: youtube
            label: YouTube
            type: object
            description: "YouTube kanal bağlantısı ayarları."
            fields:
              - name: active
                label: Aktif Et
                type: boolean
                description: "Bu bağlantıyı sitede göster."
              - name: url
                label: Profil Bağlantısı
                type: string
                description: "Tam kanal web adresi (örn. https://youtube.com/@kanal)."

          - name: facebook
            label: Facebook
            type: object
            description: "Facebook profil bağlantısı ayarları."
            fields:
              - name: active
                label: Aktif Et
                type: boolean
                description: "Bu bağlantıyı sitede göster."
              - name: url
                label: Profil Bağlantısı
                type: string
                description: "Tam profil web adresi (örn. https://facebook.com/kullanici)."

          - name: github
            label: GitHub
            type: object
            description: "GitHub profil bağlantısı ayarları."
            fields:
              - name: active
                label: Aktif Et
                type: boolean
                description: "Bu bağlantıyı sitede göster."
              - name: url
                label: Profil Bağlantısı
                type: string
                description: "Tam profil web adresi (örn. https://github.com/kullanici)."

          - name: linkedin
            label: LinkedIn
            type: object
            description: "LinkedIn profil bağlantısı ayarları."
            fields:
              - name: active
                label: Aktif Et
                type: boolean
                description: "Bu bağlantıyı sitede göster."
              - name: url
                label: Profil Bağlantısı
                type: string
                description: "Tam profil web adresi (örn. https://linkedin.com/in/kullanici)."

      - name: customLinks
        label: Özel Bağlantılar (Spotify, Substack vb.)
        type: object
        list: true
        description: "Listede bulunmayan diğer platform bağlantıları (Medium, Spotify, Substack vb.)."
        fields:
          - name: title
            label: Platform Adı
            type: string
            description: "Platformun adı (örn. Spotify)."

          - name: url
            label: Bağlantı Adresi
            type: string
            description: "Tam web bağlantı adresi (örn. https://open.spotify.com/user/...)."

          - name: active
            label: Aktif Et
            type: boolean
            description: "Bu bağlantıyı sitede göster."
