media:
  - name: gorseller
    label: Görseller & Medya
    input: public/gorseller
    output: /gorseller

content:
  # 1. Uzun Makaleler & Notlar
  - name: yazilar
    label: Yazılar
    type: collection
    path: yazilar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
        - summary
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        required: true

      - name: date
        label: Tarih
        type: date
        required: true

      - name: summary
        label: Kısa Özet
        type: text

      - name: tags
        label: Etiketler
        type: string
        list: true

      - name: image
        label: Kapak Görseli (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası (İsteğe bağlı)
        type: file
        options:
          media: gorseller

      - name: body
        label: İçerik
        type: rich-text
        options:
          media: gorseller
        required: true

  # 2. Akış (Mikro-Blog / Anlık Düşünceler)
  - name: akis
    label: Akış (Anlık Düşünceler)
    type: collection
    path: akis
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields:
        - body
        - date
      primary: body
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: body
        label: Düşünce Metni
        type: rich-text
        options:
          media: gorseller
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        options:
          time: true
        required: true

      - name: season
        label: Sezon No (İsteğe bağlı)
        type: string

      - name: episode
        label: Bölüm No (İsteğe bağlı)
        type: string

      - name: rating
        label: Puan (İsteğe bağlı)
        type: string

      - name: image
        label: Görsel (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Notu (İsteğe bağlı)
        type: file
        options:
          media: gorseller

  # 3. Profil, Hakkımda ve Sosyal Medya Ayarları
  - name: profil
    label: Hakkımda & Sosyal Medya
    type: file
    path: src/content/profil.json
    fields:
      - name: title
        label: Hakkımda Başlığı
        type: string

      - name: avatar
        label: Profil Fotoğrafı (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: bio
        label: Biyografi Metni
        type: rich-text
        options:
          media: gorseller

      - name: social
        label: Sosyal Medya Platformları
        type: object
        fields:
          - name: twitter
            label: X (Twitter)
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: instagram
            label: Instagram
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: youtube
            label: YouTube
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: facebook
            label: Facebook
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: github
            label: GitHub
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: linkedin
            label: LinkedIn
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

      - name: customLinks
        label: Özel Bağlantılar (Spotify, Substack vb.)
        type: object
        list: true
        fields:
          - name: title
            label: Platform Adı
            type: string

          - name: url
            label: Bağlantı Adresi
            type: string

          - name: active
            label: Aktif Et
            type: boolean
