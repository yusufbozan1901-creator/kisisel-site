media:
  - name: gorseller
    label: Görseller & Medya
    input: public/gorseller
    output: /gorseller

content:
  # 1. Uzun Makaleler & Notlar
  - name: yazilar
    label: Yazılar
    type: collection
    path: yazilar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
        - summary
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        options:
          time: true
        required: true

      - name: summary
        label: Kısa Özet
        type: text

      - name: tags
        label: Etiketler
        type: string
        list: true

      - name: image
        label: Kapak Görseli (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Dosyası (İsteğe bağlı)
        type: file
        options:
          media: gorseller

      - name: body
        label: İçerik
        type: rich-text
        options:
          media: gorseller
        required: true

  # 2. Akış (Mikro-Blog / Anlık Düşünceler)
  - name: akis
    label: Akış (Anlık Düşünceler)
    type: collection
    path: akis
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields:
        - body
        - date
      primary: body
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: body
        label: Düşünce Metni
        type: rich-text
        options:
          media: gorseller
        required: true

      - name: date
        label: Tarih ve Saat
        type: date
        options:
          time: true
        required: true

      - name: season
        label: Sezon No (İsteğe bağlı)
        type: string

      - name: episode
        label: Bölüm No (İsteğe bağlı)
        type: string

      - name: rating
        label: Puan (İsteğe bağlı)
        type: string

      - name: image
        label: Görsel (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: audio
        label: Ses Notu (İsteğe bağlı)
        type: file
        options:
          media: gorseller

  # 3. Şu Sıralar (Now Bento Şeridi)
  - name: now
    label: Şu Sıralar (Now Bento)
    type: file
    path: src/content/now.json
    fields:
      - name: focus
        label: 1. Üzerinde Çalıştığım (Odak)
        type: object
        fields:
          - name: title
            label: Proje / Odak Başlığı
            type: string
          - name: description
            label: Açıklama
            type: text
          - name: status
            label: Durum (örn. Aktif Geliştirme)
            type: string
          - name: updatedAt
            label: Güncelleme (örn. Bugün)
            type: string
      - name: shelf
        label: 2. Şu An Rafta (Dizi / Film / Kitap)
        type: object
        fields:
          - name: itemTitle
            label: Birincil Eser (Dizi / Film / Kitap)
            type: string
          - name: itemType
            label: Tür (örn. Dizi, Kitap, Film)
            type: string
          - name: itemMeta
            label: Bölüm / Sayfa / Süre (örn. S02 • B04)
            type: string
          - name: subItemTitle
            label: İkincil Eser (İsteğe bağlı)
            type: string
          - name: subItemType
            label: İkincil Tür
            type: string
          - name: subItemMeta
            label: İkincil Bölüm / Sayfa
            type: string
          - name: status
            label: Durum (örn. Takip Ediliyor)
            type: string
      - name: thought
        label: 3. Son Düşünce (Aforizma / Alıntı)
        type: object
        fields:
          - name: quote
            label: Düşünce / Alıntı Metni
            type: text
          - name: context
            label: Konu / Bağlam
            type: string
          - name: label
            label: Etiket (örn. Mikro-Not Defteri)
            type: string
          - name: date
            label: Tarih / Zaman (örn. 16 Kasım)
            type: string

  # 4. Rafım (Film, Dizi & Kitap Arşivi)
  - name: raf
    label: Rafım (Kültür Arşivi)
    type: collection
    path: raf
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - type
        - rating
        - status
      primary: title
    fields:
      - name: title
        label: Eser Başlığı
        type: string
        required: true
      - name: type
        label: Tür
        type: select
        options:
          values:
            - Film
            - Dizi
            - Kitap
        required: true
      - name: category
        label: Kategori (örn. Bilim Kurgu, Tipografi)
        type: string
      - name: rating
        label: Puan (örn. ★ 9.4)
        type: string
      - name: status
        label: Durum
        type: select
        options:
          values:
            - İzleniyor
            - Okunuyor
            - Tamamlandı
            - Başyapıt
        required: true
      - name: badge
        label: Rozet / Sezon-Bölüm (örn. S02 • B04)
        type: string
      - name: poster
        label: Afiş Görseli
        type: image
        options:
          media: gorseller
      - name: year
        label: Çıkış Yılı
        type: string
      - name: progress
        label: İlerleme (örn. s. 84 / 176)
        type: string
      - name: updatedAt
        label: Son Durum Zamanı (örn. Dün)
        type: string
      - name: body
        label: Kişisel Not & İnceleme
        type: rich-text
        options:
          media: gorseller

  # 5. Videolar
  - name: videolar
    label: Videolar
    type: collection
    path: videolar
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      fields:
        - title
        - date
      primary: title
    fields:
      - name: title
        label: Video Başlığı
        type: string
        required: true
      - name: youtubeId
        label: YouTube Linki veya ID'si
        type: string
        required: true
      - name: date
        label: Tarih ve Saat
        type: date
        options:
          time: true
      - name: body
        label: Açıklama (İsteğe bağlı)
        type: rich-text
        options:
          media: gorseller

  # 6. Profil, Hakkımda ve Sosyal Medya Ayarları
  - name: profil
    label: Hakkımda & Sosyal Medya
    type: file
    path: src/content/profil.json
    fields:
      - name: title
        label: Hakkımda Başlığı
        type: string

      - name: location
        label: Şehir / Konum (İsteğe bağlı)
        type: string

      - name: avatar
        label: Profil Fotoğrafı (İsteğe bağlı)
        type: image
        options:
          media: gorseller

      - name: bio
        label: Biyografi Metni
        type: rich-text
        options:
          media: gorseller

      - name: social
        label: Sosyal Medya Platformları
        type: object
        fields:
          - name: twitter
            label: X (Twitter)
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: instagram
            label: Instagram
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: youtube
            label: YouTube
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: facebook
            label: Facebook
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: github
            label: GitHub
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

          - name: linkedin
            label: LinkedIn
            type: object
            fields:
              - name: active
                label: Aktif Et
                type: boolean
              - name: url
                label: Profil Bağlantısı
                type: string

      - name: customLinks
        label: Özel Bağlantılar (Spotify, Substack vb.)
        type: object
        list: true
        fields:
          - name: title
            label: Platform Adı
            type: string

          - name: url
            label: Bağlantı Adresi
            type: string

          - name: active
            label: Aktif Et
            type: boolean
